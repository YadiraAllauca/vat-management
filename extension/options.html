<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lila · Ajustes de la extensión</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #332f40;
        background: #f8f9fc;
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 40px 20px;
      }
      main {
        width: min(460px, 100%);
        background: #fff;
        border: 1px solid #eeedf3;
        border-radius: 18px;
        padding: 28px;
      }
      .mark {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #7046aa;
      }
      .mark i {
        font-style: normal;
        color: #b69bdc;
      }
      h1 {
        margin: 14px 0 6px;
        font-size: 20px;
        font-weight: 650;
      }
      p.lead {
        margin: 0 0 24px;
        color: #595466;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-bottom: 18px;
      }
      span.name {
        display: block;
        font-weight: 550;
        margin-bottom: 4px;
      }
      span.help {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        color: #858190;
        line-height: 1.45;
      }
      input {
        width: 100%;
        min-height: 42px;
        padding: 0 12px;
        font: inherit;
        color: inherit;
        background: #fcfbfe;
        border: 1px solid #e4e1ee;
        border-radius: 10px;
      }
      input:focus-visible {
        outline: 3px solid #b69bdc;
        outline-offset: 2px;
        border-color: #b69bdc;
      }
      button {
        min-height: 42px;
        padding: 0 18px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #7046aa;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:hover {
        background: #5d3792;
      }
      button:focus-visible {
        outline: 3px solid #b69bdc;
        outline-offset: 2px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #status {
        color: #5d3792;
        font-weight: 550;
      }
      .error {
        color: #a3314c;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">l<i>•</i></span>
      <h1>Ajustes de la extensión</h1>
      <p class="lead">
        Los datos de tus facturas nunca salen de este navegador. Estos ajustes
        solo le dicen a la extensión dónde está tu Lila y cuál identificación
        es la tuya.
      </p>
      <form id="form">
        <label>
          <span class="name">Dirección de Lila</span>
          <input
            id="lilaUrl"
            type="url"
            inputmode="url"
            placeholder="https://mi-lila.vercel.app/"
            required
          />
          <span class="help">
            La pestaña que se abre al enviar las facturas. Si usas un dominio
            propio, agrégalo también a <code>content_scripts</code> en
            <code>manifest.json</code>.
          </span>
        </label>
        <label>
          <span class="name">Tu cédula</span>
          <input
            id="cedula"
            inputmode="numeric"
            pattern="\d{10}"
            placeholder="0912345678"
          />
          <span class="help">
            Diez dígitos. Las facturas emitidas a tu cédula entran como gastos
            personales, con el importe total.
          </span>
        </label>
        <label>
          <span class="name">Tu RUC</span>
          <input
            id="ruc"
            inputmode="numeric"
            pattern="\d{13}"
            placeholder="0912345678001"
          />
          <span class="help">
            Trece dígitos. Las facturas emitidas a tu RUC entran como aplicable
            IVA, con el valor sin impuestos.
          </span>
        </label>
        <div class="row">
          <button type="submit">Guardar ajustes</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
